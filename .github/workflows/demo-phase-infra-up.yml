name: demo-phase-infra-up

on:
  workflow_call:
    secrets:
      DEMO_ORCHESTRATOR_PAT:
        required: true

env:
  ORG: fiap-vcosta
  POLL_SECONDS: "20"

jobs:
  apply:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repo:
          - infra-db
          - infra-k8s
          - infra-events
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dispatch tf-apply
        env:
          DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}
        run: |
          set -euo pipefail
          echo "$DEMO_ORCHESTRATOR_PAT" | gh auth login --with-token
          chmod +x scripts/gh-dispatch-wait.sh
          ./scripts/gh-dispatch-wait.sh "${{ matrix.repo }}" tf-apply.yml
