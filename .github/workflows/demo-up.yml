name: demo-up

on:
  workflow_dispatch:

concurrency:
  group: demo-window
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  infra:
    name: infra
    uses: ./.github/workflows/demo-phase-infra-up.yml
    secrets:
      DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}

  tf-servicos:
    name: tf-servicos
    needs: infra
    uses: ./.github/workflows/demo-phase-services-tf-up.yml
    secrets:
      DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}

  deploy:
    name: deploy
    needs: tf-servicos
    uses: ./.github/workflows/demo-phase-services-deploy.yml
    secrets:
      DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}
