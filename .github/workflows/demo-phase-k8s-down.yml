name: demo-phase-k8s-down

on:
  workflow_call:
    secrets:
      DEMO_ORCHESTRATOR_PAT:
        required: true

env:
  ORG: fiap-vcosta
  POLL_SECONDS: "20"

jobs:
  destroy:
    name: infra-k8s
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dispatch tf-destroy
        env:
          DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}
        run: |
          set -euo pipefail
          echo "$DEMO_ORCHESTRATOR_PAT" | gh auth login --with-token
          chmod +x scripts/gh-dispatch-wait.sh
          ./scripts/gh-dispatch-wait.sh infra-k8s tf-destroy.yml
