name: demo-phase-infra-rest-down

on:
  workflow_call:
    secrets:
      DEMO_ORCHESTRATOR_PAT:
        required: true

env:
  ORG: fiap-vcosta
  POLL_SECONDS: "20"

jobs:
  destroy:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        repo:
          - infra-events
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dispatch tf-destroy
        env:
          DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}
        run: |
          set -euo pipefail
          echo "$DEMO_ORCHESTRATOR_PAT" | gh auth login --with-token
          chmod +x scripts/gh-dispatch-wait.sh
          ./scripts/gh-dispatch-wait.sh "${{ matrix.repo }}" tf-destroy.yml
