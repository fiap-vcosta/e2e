name: demo-down

on:
  workflow_dispatch:

concurrency:
  group: demo-window
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  k8s:
    name: k8s
    uses: ./.github/workflows/demo-phase-k8s-down.yml
    secrets:
      DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}

  tf-servicos:
    name: tf-servicos
    needs: k8s
    uses: ./.github/workflows/demo-phase-services-down.yml
    secrets:
      DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}

  infra:
    name: infra
    needs: tf-servicos
    uses: ./.github/workflows/demo-phase-infra-rest-down.yml
    secrets:
      DEMO_ORCHESTRATOR_PAT: ${{ secrets.DEMO_ORCHESTRATOR_PAT }}
